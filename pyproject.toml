[project]
name = "scrape-nba-standings"
version = "0.1.0"
description = "Scrapes basketball-reference.com for current NBA standings based on last year in season range defined in .env file"
readme = "README.md"
authors = [
    { name = "Dylan Cawsey", email = "dylancawsey@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "boto3>=1.40.47",
    "botocore>=1.40.47",
    "certifi>=2025.10.5",
    "charset-normalizer>=3.4.3",
    "idna>=3.10",
    "jmespath>=1.0.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "s3transfer>=0.14.0",
    "six>=1.17.0",
    "soupsieve>=2.8",
    "typing_extensions>=4.15.0",
    "urllib3>=2.5.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false